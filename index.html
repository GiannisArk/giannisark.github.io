<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Package Search</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
      color: #374151;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 1rem 0;
      text-align: center;
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
    }

    .title {
      font-size: 2rem;
      margin: 0;
      letter-spacing: 2px;
    }

    .bold {
      font-weight: 700;
      color: #3b82f6; /* blue */
    }

    .subtitle {
      font-weight: 400;
      font-size: 1rem;
      color: #9ca3af;
      margin-top: 0.25rem;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

   .search-container {
  background: white;
  padding: 2rem;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
  width: 95%;          /* increase width */
  max-width: 1200px;   /* make max-width wider */
  color: #374151;
  overflow-x: auto;    /* keep horizontal scroll for smaller screens */
}

    form#searchForm {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input#searchInput {
      flex-grow: 1;
      padding: 0.5rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      outline-offset: 2px;
      transition: border-color 0.3s ease;
    }

    input#searchInput:focus {
      border-color: #3b82f6;
      outline: none;
    }

    button {
      padding: 0.5rem 1rem;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2563eb;
    }

    footer {
      background: #1f2937;
      color: #9ca3af;
      text-align: center;
      padding: 1rem 0;
      font-size: 0.875rem;
    }

    /* DataTables adjustment */
    table.dataTable thead th {
      background-color: #f3f4f6;
      font-weight: 600;
      color: #374151;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="title">
      I<span class="bold">d</span>io<span class="bold">s</span>y<span class="bold">ncrasy</span>
    </h1>
    <div class="subtitle">Data Sharing aNd Collection Reveal Android SYstem</div>
  </header>

  <main>
    <div class="search-container">
      <form id="searchForm" autocomplete="off">
        <input type="text" id="searchInput" placeholder="package_name" />
        <button type="submit">Search</button>
      </form>
      <div class="result" id="result" style="margin-top: 1.5rem;"></div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      &copy; 2025 Idiosyncrasy. All rights reserved.
    </div>
  </footer>

  <!-- jQuery and DataTables JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    let dataTable;  // Store DataTable instance
    const API_URL = 'http://127.0.0.1:5000/';

    // Function to render data into DataTable
    function renderTable(data) {
      if (!data || data.length === 0 || (data[0].name === "-" && data[0].package_name === "-")) {
        document.getElementById('result').innerHTML = '<span style="color:red;">No data available.</span>';
        if (dataTable) {
          dataTable.clear().draw();
        }
        return;
      }

      document.getElementById('result').innerHTML = `
        <table id="resultsTable" class="display" style="width:100%">
          <thead>
            <tr>
              <th>Name</th>
              <th>Package Name</th>
              <th>Version</th>
              <th>Downloads</th>
              <th>Collected Data</th>
              <th>Shared Data</th>
              <th>Type</th>
              <th>Mode</th>
              <th>Icon</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      `;

      if (dataTable) {
        dataTable.destroy();
      }

      const rows = data.map(item => [
        item.name,
        item.package_name,
        item.version,
        item.downloads,
        item.collect,
        item.share,
        item.type,
        item.mode,
        `<img src="data:image/png;base64,${item.icon}" alt="icon" style="width:40px; height:40px; border-radius:8px;">`
      ]);

      dataTable = $('#resultsTable').DataTable({
        data: rows,
        columns: [
          { title: "Name" },
          { title: "Package Name" },
          { title: "Version" },
          { title: "Downloads" },
          { title: "Collected Data" },
          { title: "Shared Data" },
          { title: "Type" },
          { title: "Mode" },
          { title: "Icon", orderable: false, searchable: false }
        ],
        pageLength: 5,
        lengthChange: false,
        language: {
          emptyTable: "No apps found"
        }
      });
    }

    // On page load: fetch top downloads and show them
    async function loadTopDownloads(limit = 5) {
      try {
        const res = await fetch(API_URL + `top_downloads?limit=${limit}`);
        const data = await res.json();
        renderTable(data);
      } catch (error) {
        console.error('Error loading top downloads:', error);
        document.getElementById('result').innerHTML = '<span style="color:red;">Error loading data.</span>';
      }
    }

    // Search form submit event
    document.getElementById('searchForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const input = document.getElementById('searchInput').value.trim();
      const package_name = input.replace(/[<>]/g, "");

      if (!package_name) {
        document.getElementById('result').textContent = "Please enter a package name.";
        return;
      }

      location.hash = package_name;

      try {
        const res = await fetch(API_URL + "search/" + package_name);
        const data = await res.json();
        renderTable(data);
      } catch (error) {
        console.error(error);
        document.getElementById('result').innerHTML = '<span style="color:red;">Error fetching data.</span>';
      }
    });

    // Initial load
    loadTopDownloads();

  </script>

</body>
</html>
